name: Deploy Vietnam Sports Hub to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'Sport/Cloudflare/VietnamSportsHub/**'
      - '.github/workflows/deploy-vietnam-sports-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Sport/Cloudflare/VietnamSportsHub
          command: deploy
